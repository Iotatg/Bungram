name: CI

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server:
    name: Server (Kotlin / Ktor)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          # The wrapper pins Gradle 8.9; let the action cache that exact distribution.
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Build
        working-directory: server
        run: ./gradlew build --no-daemon --stacktrace

      - name: Smoke test the server
        working-directory: server
        run: |
          ./gradlew installDist --no-daemon
          BUNGRAM_DEV=1 BUNGRAM_MEDIA_DIR="$RUNNER_TEMP/media" PORT=8080 \
            nohup ./build/install/bungram-server/bin/bungram-server > "$RUNNER_TEMP/server.log" 2>&1 &
          for i in $(seq 1 40); do
            if curl -sf http://127.0.0.1:8080/v1/healthz > /dev/null; then
              echo "server up after ${i}s"
              curl -s http://127.0.0.1:8080/v1/healthz
              exit 0
            fi
            sleep 1
          done
          echo "server did not start" >&2
          cat "$RUNNER_TEMP/server.log" >&2
          exit 1

  android:
    name: Android (Kotlin / Compose)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # ubuntu-latest already ships the Android SDK with build-tools and platform 35.
      # Installing it again through sdkmanager is what used to break this job.
      - name: Locate Android SDK
        run: |
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          ls "$SDK/platforms" "$SDK/build-tools"

      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Unit tests (crypto)
        working-directory: android
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          ./gradlew :app:testDebugUnitTest --no-daemon --stacktrace

      - name: Assemble debug
        working-directory: android
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Report APK
        working-directory: android
        run: |
          APK=$(ls app/build/outputs/apk/debug/*.apk | head -1)
          "$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)/aapt2" dump badging "$APK" | head -3
          du -h "$APK"

      - name: Test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: crypto-test-report
          path: android/app/build/reports/tests/testDebugUnitTest
          retention-days: 7

      - uses: actions/upload-artifact@v4
        with:
          name: bungram-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 14

  protocol:
    name: Protocol tests (messaging + media + groups)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install test deps
        run: pip install requests pillow websockets

      - uses: gradle/actions/setup-gradle@v4

      - name: Start server
        working-directory: server
        run: |
          ./gradlew installDist --no-daemon --stacktrace
          BUNGRAM_DEV=1 BUNGRAM_MEDIA_DIR="$RUNNER_TEMP/media" PORT=8080 \
            nohup ./build/install/bungram-server/bin/bungram-server > "$RUNNER_TEMP/server.log" 2>&1 &
          for i in $(seq 1 60); do
            curl -sf http://127.0.0.1:8080/v1/healthz > /dev/null && exit 0
            sleep 1
          done
          echo "server did not start" >&2
          cat "$RUNNER_TEMP/server.log" >&2
          exit 1

      - name: Two-device messaging
        run: python3 tools/e2e_two_devices.py

      - name: Media pipeline
        run: python3 tools/e2e_media.py

      - name: Groups, channels, invites, pre-keys
        run: python3 tools/e2e_groups.py
