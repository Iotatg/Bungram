# The whole build (Gradle daemon + Kotlin daemon + dex workers) must fit in a small container.
# 2 GB heap for Gradle and 1.5 GB for the Kotlin compiler is comfortably enough for a single module.
org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8
kotlin.daemon.jvmargs=-Xmx1536m -XX:MaxMetaspaceSize=512m
org.gradle.parallel=false
org.gradle.workers.max=4
org.gradle.caching=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
